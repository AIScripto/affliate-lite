# Panel (React build) + forwarding of tracking and API paths to the backend.
# Public traffic arrives through the server's Caddy (https), which connects from the Docker network.

# Keep "https" from Caddy; fall back to this server's own scheme for direct (local) requests
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ''      $scheme;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Real visitor IP: trust X-Forwarded-For only from Caddy / Docker networks, never from the internet.
  # Caddy itself replaces any X-Forwarded-For a visitor sends, so the value cannot be faked.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  location / {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires 0;
    try_files $uri $uri/ /index.html;
  }

  # Container health check (exact match, so /health/database still reaches the backend)
  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "healthy\n";
  }

  # Backend paths: API, tracking link, postbacks and pixels, script pixel, backend health
  location ~ ^/(api/|click|postback|sdk/|health/) {
    proxy_pass http://backend:3086;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # $remote_addr is the visitor's IP after the real-IP step above
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }
}
