version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: affiliate_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: affiliate_tracker
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d affiliate_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: affiliate_backend
    restart: always
    ports:
      - "3086:3086"
    environment:
      PORT: 3086
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/affiliate_tracker
      JWT_SECRET: super_secure_affiliate_jwt_token_2026
      CORS_ORIGIN: http://localhost:3085
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: affiliate_frontend
    restart: always
    ports:
      - "3085:3085"
    environment:
      VITE_BACKEND_URL: http://backend:3086
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
