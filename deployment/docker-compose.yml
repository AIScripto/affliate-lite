# Production stack for Affiliate Tracker.
# Images are built by build-and-push.sh and selected with APP_TAG.
# Use ./deploy.sh <tag> instead of running this file by hand.
#
# HTTPS is handled by the Caddy service already running on the server (shared by every site there),
# see host-caddy.example. Ports are bound to 127.0.0.1 so the only way in is through Caddy (https).
# Do NOT add a Caddy container here: it would take ports 80/443 from the shared Caddy and stop every site.
name: affliate

services:

  # ── Database job: pushes/synchronizes Prisma schema with PostgreSQL, then exits ──
  migrate:
    image: tariqsulehri/affliate-be:${APP_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env.backend
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "npx prisma db push --accept-data-loss"]
    restart: "no"

  # ── Backend API ───────────────────────────────────────────
  backend:
    image: tariqsulehri/affliate-be:${APP_TAG:-latest}
    platform: linux/amd64
    container_name: affliate_be
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      NODE_ENV: production
      PORT: 3086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Only reachable from the server itself (Caddy -> nginx -> backend). Set BACKEND_BIND=0.0.0.0 to open it.
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-3086}:3086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend (Nginx + built React SPA) ────────────────────
  frontend:
    image: tariqsulehri/affliate-fe:${APP_TAG:-latest}
    platform: linux/amd64
    container_name: affliate_fe
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Only reachable from the server itself; the public address is the https domain served by Caddy.
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3085}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
