# Production stack for Affiliate Tracker.
# Images are built by build-and-push.sh and selected with APP_TAG.
# Use ./deploy.sh <tag> instead of running this file by hand.
name: affliate

services:

  # ── Database job: pushes/synchronizes Prisma schema with PostgreSQL, then exits ──
  migrate:
    image: tariqsulehri/affliate-be:${APP_TAG:-latest}
    platform: linux/amd64
    env_file:
      - .env.backend
    environment:
      NODE_ENV: production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["sh", "-c", "npx prisma db push --accept-data-loss"]
    restart: "no"

  # ── Backend API ───────────────────────────────────────────
  backend:
    image: tariqsulehri/affliate-be:${APP_TAG:-latest}
    platform: linux/amd64
    container_name: affliate_be
    restart: unless-stopped
    env_file:
      - .env.backend
    environment:
      NODE_ENV: production
      PORT: 3086
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # Defaults to port 3086 on host
      - "${BACKEND_BIND:-0.0.0.0}:${BACKEND_PORT:-3086}:3086"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3086/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Frontend (Nginx + built React SPA) ────────────────────
  frontend:
    image: tariqsulehri/affliate-fe:${APP_TAG:-latest}
    platform: linux/amd64
    container_name: affliate_fe
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      # Defaults to port 3085 on host
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-3085}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── HTTPS reverse proxy (optional): docker compose --profile https up -d ──
  caddy:
    image: caddy:2.8-alpine
    profiles: ["https"]
    container_name: affliate_caddy
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
